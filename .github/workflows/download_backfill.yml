name: RTHK Download Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date"
        required: true
        default: "2026-04-01"
      end_date:
        description: "End date"
        required: true
        default: "2026-05-09"
      max_pages:
        description: "Max pages"
        required: true
        default: "40"

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ffmpeg and rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore rclone config
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Download MP3 files
        run: |
          python scripts/scan_rthk.py \
            --start "${{ github.event.inputs.start_date }}" \
            --end "${{ github.event.inputs.end_date }}" \
            --max-pages "${{ github.event.inputs.max_pages }}" \
            --download \
            --download-dir downloads

      - name: Show downloaded files
        run: |
          find downloads -type f -maxdepth 2 || true

      - name: Upload MP3 files to Google Drive with rclone
        run: |
          rclone copy downloads gdrive:freeaswind \
            --drive-chunk-size 64M \
            --transfers 2 \
            --checkers 4 \
            --progress

      - name: Upload CSV logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rthk-download-logs
          path: output/*.csv
          if-no-files-found: ignore
