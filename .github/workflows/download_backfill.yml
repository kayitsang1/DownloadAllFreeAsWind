name: RTHK Download Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date"
        required: true
        default: "2026-04-01"
      end_date:
        description: "End date"
        required: true
        default: "2026-05-08"
      max_pages:
        description: "Max pages"
        required: true
        default: "10"

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Scan, download MP3, and upload to Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python scripts/scan_rthk.py \
            --start "${{ github.event.inputs.start_date }}" \
            --end "${{ github.event.inputs.end_date }}" \
            --max-pages "${{ github.event.inputs.max_pages }}" \
            --download \
            --drive-upload

      - name: Upload CSV logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rthk-download-logs
          path: output/*.csv
          if-no-files-found: ignore
