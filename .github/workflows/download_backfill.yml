name: RTHK Download Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date"
        required: true
        default: "2026-04-01"
      end_date:
        description: "End date"
        required: true
        default: "2026-05-09"
      max_pages:
        description: "Max pages"
        required: true
        default: "20"

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ffmpeg and rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Restore rclone config
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Download MP3
        run: |
          python scripts/scan_rthk.py \
            --start "${{ github.event.inputs.start_date }}" \
            --end "${{ github.event.inputs.end_date }}" \
            --max-pages "${{ github.event.inputs.max_pages }}" \
            --download \
            --download-dir downloads

      - name: Show downloaded files
        run: |
          echo "Downloaded files:"
          find downloads -type f || true

      - name: Upload to Google Drive via rclone
        run: |
          rclone copy downloads gdrive:freeaswind \
            --drive-chunk-size 64M \
            --transfers 2 \
            --checkers 4 \
            --progress

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rthk-download-logs
          path: output/*.csv
          if-no-files-found: ignore
